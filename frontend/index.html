<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PBR Texture Converter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="tabs">
    <button class="tab-btn active" data-tab="source">Source</button>
    <button class="tab-btn" data-tab="edit">Edit</button>
    <button class="tab-btn" data-tab="deliver">Deliver</button>
  </div>

  <section id="source" class="tab-panel active">
    <div class="toolbar">
      <button id="pick-folder-btn">Choose Folder…</button>
      <span id="folder-path" class="folder-path"></span>
      <button id="rescan-btn" disabled>Rescan</button>
    </div>
    <div id="unmatched-box" class="unmatched-box" hidden>
      <strong>Unmatched files</strong>
      <ul id="unmatched-list"></ul>
    </div>
    <table id="materials-table">
      <thead>
        <tr>
          <th>Material</th>
          <th>D</th><th>N</th><th>M</th><th>R</th><th>O</th><th>A</th>
        </tr>
      </thead>
      <tbody id="materials-tbody"></tbody>
    </table>
  </section>

  <section id="edit" class="tab-panel">
    <p class="hint">Select a material on the Source tab to edit its maps here.</p>
    <div id="edit-content"></div>
  </section>

  <section id="deliver" class="tab-panel">
    <div class="toolbar">
      <label for="output-root">Output folder:</label>
      <input id="output-root" type="text" placeholder="/path/to/output">
      <button id="deliver-btn">Deliver Selected</button>
    </div>
    <p class="hint">Checked materials on the Source tab will be written as
      <code>MaterialName/diffuse|normal|metal|rough|opacity|ao/</code></p>
    <pre id="deliver-log"></pre>
  </section>

  <script src="app.js"></script>
</body>
</html>
